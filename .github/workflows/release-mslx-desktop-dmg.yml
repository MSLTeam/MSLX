name: 发布 MSLX-Desktop (macOS DMG包)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    name: 构建并发布 macOS DMG
    
    strategy:
      matrix:
        include:
          - { arch: x64,   rid: osx-x64,   bin: 'MSLX-Desktop' }
          - { arch: arm64, rid: osx-arm64, bin: 'MSLX-Desktop' }

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 确定版本号 (Tag vs Manual)
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${{ github.ref_name }}"
            BUNDLE_SHORT_VERSION="${VERSION_NAME#v}"
            BUNDLE_SHORT_VERSION="${BUNDLE_SHORT_VERSION%%-*}"
            echo "这是正式 Release 构建: ${{ github.ref_name }}"
          else
            VERSION_NAME="beta"
            BUNDLE_SHORT_VERSION=$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' ./MSLX.Desktop/MSLX.Desktop.csproj)
            echo "这是手动触发构建，使用版本号: beta"
          fi

          if [[ ! "$BUNDLE_SHORT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CFBundleShortVersionString 必须是 x.y.z，当前值为: $BUNDLE_SHORT_VERSION"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_SHORT_VERSION=$BUNDLE_SHORT_VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_VERSION=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: 配置 NetSparkle 发布参数
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          if [[ "$VERSION_NAME" == "beta" || -z "$SPARKLE_PRIVATE_KEY" || -z "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "NETSPARKLE_ENABLED=false" >> "$GITHUB_ENV"
            echo "NETSPARKLE_APPCAST_URL=" >> "$GITHUB_ENV"
            echo "NETSPARKLE_ED25519_PUBLIC_KEY=" >> "$GITHUB_ENV"
            echo "::notice::NetSparkle 未启用；正式发布需要同时配置 Ed25519 公钥和私钥"
            exit 0
          fi

          echo "NETSPARKLE_ENABLED=true" >> "$GITHUB_ENV"
          echo "NETSPARKLE_APPCAST_URL=https://github.com/MSLTeam/MSLX/releases/latest/download/appcast-${{ matrix.rid }}.xml" >> "$GITHUB_ENV"
          echo "NETSPARKLE_ED25519_PUBLIC_KEY=$SPARKLE_PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: 导入 Developer ID Application 证书
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/mslx-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mslx-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          if [[ -z "$MACOS_CERTIFICATE_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::缺少 macOS 签名证书 Secrets"
            exit 1
          fi

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::证书中未找到 Developer ID Application 身份"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: 发布 macOS 独立运行包 (生成 .app)
        run: |
          DESKTOP_PUBLISH_DIR="./publish_desktop_temp"
          DAEMON_PUBLISH_DIR="./publish_daemon_temp"
          DIST_DIR="./dist"
          mkdir -p $DIST_DIR

          DESKTOP_VERSION=$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' ./MSLX.Desktop/MSLX.Desktop.csproj)
          DAEMON_VERSION=$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' ./MSLX.Daemon/MSLX.Daemon.csproj)
          if [[ "$DESKTOP_VERSION" != "$DAEMON_VERSION" ]]; then
            echo "::error::Desktop 与 Daemon 版本不一致: $DESKTOP_VERSION != $DAEMON_VERSION"
            exit 1
          fi

          if [[ "$VERSION_NAME" != "beta" && "$DESKTOP_VERSION" != "$BUNDLE_SHORT_VERSION" ]]; then
            echo "::error::Git Tag 与 Desktop 版本不一致: $BUNDLE_SHORT_VERSION != $DESKTOP_VERSION"
            exit 1
          fi
          
          dotnet publish ./MSLX.Desktop/MSLX.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$DESKTOP_PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:NetSparkleAppCastUrl="$NETSPARKLE_APPCAST_URL" \
            -p:NetSparkleEd25519PublicKey="$NETSPARKLE_ED25519_PUBLIC_KEY"

          dotnet publish ./MSLX.Daemon/MSLX.Daemon.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$DAEMON_PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: 安装 create-dmg 工具
        run: brew install create-dmg

      - name: 生成 .dmg 安装包
        run: |
          BASE_NAME="MSLX-Desktop_${{ env.VERSION_NAME }}_${{ matrix.rid }}"
          DIST_DIR="./dist"
          
          echo "开始手动构建 macOS .app 结构..."
          APP_NAME="MSLX.app"
          APP_DIR="dmg_build/$APP_NAME"
          
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # 1. 将同架构 Desktop 与 Daemon 放入 Contents/MacOS
          cp "./publish_desktop_temp/${{ matrix.bin }}" "$APP_DIR/Contents/MacOS/"
          cp "./publish_daemon_temp/MSLX-Daemon" "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/${{ matrix.bin }}"
          chmod +x "$APP_DIR/Contents/MacOS/MSLX-Daemon"
          
          # 2. 拷贝图标文件
          cp ./MSLX.Desktop/Assets/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          
          # 3. 写入标准的 Info.plist 文件
          cat <<EOF > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ matrix.bin }}</string>
              <key>CFBundleIconFile</key>
              <string>icon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>cn.mslmc.mslx</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleName</key>
              <string>MSLX</string>
              <key>CFBundleDisplayName</key>
              <string>MSLX</string>
              <key>CFBundleVersion</key>
              <string>${{ env.BUNDLE_VERSION }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ env.BUNDLE_SHORT_VERSION }}</string>
          </dict>
          </plist>
          EOF

          test "$(plutil -extract CFBundlePackageType raw -o - "$APP_DIR/Contents/Info.plist")" = "APPL"

          echo "开始签名 $APP_NAME..."
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          while IFS= read -r -d '' FILE_PATH; do
            if file "$FILE_PATH" | grep -q 'Mach-O'; then
              echo "签名: $FILE_PATH"
              codesign \
                --force \
                --timestamp \
                --options runtime \
                --entitlements ./MSLX.Desktop/macOS.entitlements \
                --keychain "$KEYCHAIN_PATH" \
                --sign "$SIGNING_IDENTITY" \
                "$FILE_PATH"
            fi
          done < <(find "$APP_DIR/Contents/MacOS" -type f -print0)

          codesign \
            --force \
            --timestamp \
            --options runtime \
            --entitlements ./MSLX.Desktop/macOS.entitlements \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_DIR"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          
          cd dmg_build
          
          # create-dmg 对 .app 进行打包，加入极简美化参数
          create-dmg \
            --volname "MSLX Installer" \
            --volicon "../MSLX.Desktop/Assets/icon.icns" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon-size 120 \
            --text-size 14 \
            --icon "$APP_NAME" 120 120 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 380 120 \
            "../$DIST_DIR/$BASE_NAME.dmg" \
            "$APP_NAME"
            
          cd ..
          
          # 将生成的包路径保存到环境变量
          echo "ASSET_PATH=./dist/$BASE_NAME.dmg" >> $GITHUB_ENV

      - name: 签名并公证 DMG
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER_ID" ]]; then
            echo "::error::缺少 App Store Connect API Key Secrets"
            exit 1
          fi

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARY_RESULT_PATH="$RUNNER_TEMP/notary-result.json"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          codesign \
            --force \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "${{ env.ASSET_PATH }}"
          codesign --verify --verbose=2 "${{ env.ASSET_PATH }}"

          set +e
          xcrun notarytool submit "${{ env.ASSET_PATH }}" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$NOTARY_RESULT_PATH"
          SUBMIT_EXIT=$?
          set -e

          cat "$NOTARY_RESULT_PATH"
          SUBMISSION_ID=$(jq -r '.id // empty' "$NOTARY_RESULT_PATH" 2>/dev/null || true)

          if [[ "$SUBMIT_EXIT" -ne 0 || -z "$SUBMISSION_ID" ]]; then
            echo "::error::Apple 公证提交失败，未获取到 Submission ID"
            exit 1
          fi

          echo "::notice title=Apple 公证已提交::Submission ID: $SUBMISSION_ID"

          while true; do
            set +e
            xcrun notarytool info "$SUBMISSION_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --output-format json > "$NOTARY_RESULT_PATH"
            INFO_EXIT=$?
            set -e

            cat "$NOTARY_RESULT_PATH"
            SUBMISSION_STATUS=$(jq -r '.status // empty' "$NOTARY_RESULT_PATH" 2>/dev/null || true)

            case "$SUBMISSION_STATUS" in
              Accepted)
                echo "Apple 公证已通过，Submission ID: $SUBMISSION_ID"
                break
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER_ID" || true
                echo "::error::Apple 公证失败，Submission ID: ${SUBMISSION_ID}，状态: $SUBMISSION_STATUS"
                exit 1
                ;;
              *)
                if [[ "$INFO_EXIT" -ne 0 ]]; then
                  echo "Apple 公证状态查询失败，将继续重试，Submission ID: $SUBMISSION_ID"
                else
                  echo "Apple 公证仍在处理中，Submission ID: ${SUBMISSION_ID}，状态: ${SUBMISSION_STATUS:-unknown}"
                fi
                sleep 60
                ;;
            esac
          done

          xcrun stapler staple "${{ env.ASSET_PATH }}"
          xcrun stapler validate "${{ env.ASSET_PATH }}"

      - name: 生成 NetSparkle AppCast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ "$NETSPARKLE_ENABLED" != "true" ]]; then
            echo "::notice::当前构建未启用 NetSparkle，跳过 AppCast 生成"
            exit 0
          fi

          TOOL_DIR="$RUNNER_TEMP/netsparkle-tools"
          dotnet tool install NetSparkleUpdater.Tools.AppCastGenerator \
            --version 2.9.0 \
            --tool-path "$TOOL_DIR"

          "$TOOL_DIR/netsparkle-generate-appcast" \
            --single-file "${{ env.ASSET_PATH }}" \
            --file-version "$BUNDLE_SHORT_VERSION" \
            --os "macos-${{ matrix.arch }}" \
            --base-url "https://github.com/MSLTeam/MSLX/releases/download/$VERSION_NAME" \
            --appcast-output-directory ./dist \
            --output-file-name "appcast-${{ matrix.rid }}" \
            --link-tag "$NETSPARKLE_APPCAST_URL" \
            --product-name "MSLX" \
            --description-tag "MSLX macOS 更新" \
            --human-readable true

          APPCAST_PATH="./dist/appcast-${{ matrix.rid }}.xml"
          APPCAST_SIGNATURE_PATH="$APPCAST_PATH.signature"
          test -f "$APPCAST_PATH"
          test -f "$APPCAST_SIGNATURE_PATH"

          echo "APPCAST_PATH=$APPCAST_PATH" >> "$GITHUB_ENV"
          echo "APPCAST_SIGNATURE_PATH=$APPCAST_SIGNATURE_PATH" >> "$GITHUB_ENV"

      - name: 清理签名凭据
        if: always()
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          rm -f "$RUNNER_TEMP/mslx-developer-id.p12"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          tag_name: ${{ env.VERSION_NAME }}
          prerelease: ${{ env.VERSION_NAME == 'beta' }}

      - name: 上传 NetSparkle AppCast 到 GitHub Release
        if: env.APPCAST_PATH != '' && env.APPCAST_SIGNATURE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APPCAST_PATH }}
            ${{ env.APPCAST_SIGNATURE_PATH }}
          tag_name: ${{ env.VERSION_NAME }}
          prerelease: ${{ env.VERSION_NAME == 'beta' }}

      - name: 同步上传到 CNB Release
        env:
          CNB_REPO_SLUG: "mslmc/mslx"
          CNB_TOKEN: ${{ secrets.CNB_MAIN_REPO_TOKEN }}
          TAG_NAME: ${{ env.VERSION_NAME }}
        run: |
          echo "正在准备同步 macOS DMG 到国内 CNB 主节点..."
          
          if [[ "$TAG_NAME" == "beta" ]]; then
            echo "当前为手动测试构建，跳过 CNB 同步。"
            exit 0
          fi

          if [ ! -f "${{ env.ASSET_PATH }}" ]; then
            echo "❌ 错误：未找到生成的 dmg 压缩包文件！"
            exit 1
          fi

          FILE_NAME=$(basename "${{ env.ASSET_PATH }}")
          # macOS runner 下获取文件大小的 stat 参数是 -f%z 而非 Linux 的 -c%s
          FILE_SIZE=$(stat -f%z "${{ env.ASSET_PATH }}")

          curl -s \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/git/branches?page_size=1" > branches_res.json
          
          CNB_TARGET_BRANCH=$(jq -r 'if type == "array" then .[0].name else .data[0].name? // .items[0].name? // "main" end' branches_res.json)
          
          if [ -z "$CNB_TARGET_BRANCH" ] || [ "$CNB_TARGET_BRANCH" = "null" ]; then
            CNB_TARGET_BRANCH="main" # 兜底安全分支
          fi
          echo "💡 锁定 CNB 侧分支为: $CNB_TARGET_BRANCH"

          curl -s -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"tag_name\": \"${TAG_NAME}\", \"target_commitish\": \"${CNB_TARGET_BRANCH}\", \"name\": \"Release ${TAG_NAME}\", \"body\": \"Synchronized from GitHub Main Repo\"}" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases" > create_res.json

          RELEASE_ID=$(jq -r '.id // empty' create_res.json)

          # 并发矩阵节点查缺补漏列表反查
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "正在反查已存在的 Release 标识符..."
            curl -s \
              -H "Authorization: token $CNB_TOKEN" \
              -H "Accept: application/json" \
              "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases" > list_res.json
            
            RELEASE_ID=$(jq -r --arg tag "$TAG_NAME" 'if type == "array" then .[] else .data[]? // .items[]? // .[]? end | select(.tag_name==$tag) | .id' list_res.json | head -n 1)
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ 错误：未能获取到 CNB 的 Release ID。返回内容："
            cat create_res.json
            echo "列表反查内容："
            cat list_res.json
            exit 1
          fi

          echo "✅ 成功对接主仓 Release，ID 为: $RELEASE_ID"

          # 获取附件上传地址
          curl -s -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"asset_name\": \"${FILE_NAME}\", \"size\": ${FILE_SIZE}, \"overwrite\": true}" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases/${RELEASE_ID}/asset-upload-url" > url_res.json

          UPLOAD_URL=$(jq -r '.upload_url // empty' url_res.json)
          VERIFY_URL=$(jq -r '.verify_url // empty' url_res.json)

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "❌ 错误：无法获取上传地址。返回内容："
            cat url_res.json
            exit 1
          fi

          echo "正在把文件 $FILE_NAME 推送到预签名高速通道..."
          curl -s -X PUT -T "${{ env.ASSET_PATH }}" "$UPLOAD_URL"

          echo "正在确认附件上传状态..."
          CONFIRM_CODE=$(curl -s -o confirm_res.json -w "%{http_code}" -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Accept: application/json" \
            "${VERIFY_URL}?ttl=0")

          if [ "$CONFIRM_CODE" -eq 200 ] || [ "$CONFIRM_CODE" -eq 201 ]; then
            echo "🎉 [${{ matrix.rid }}] DMG 产物已成功关联到 CNB 主仓 Release 页面！"
          else
            echo "❌ 错误：确认附件失败。状态码: ${CONFIRM_CODE}，返回内容："
            cat confirm_res.json
            exit 1
          fi
