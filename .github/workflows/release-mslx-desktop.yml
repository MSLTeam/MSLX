name: 发布 MSLX-Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    name: 构建并发布
    
    strategy:
      matrix:
        include:
          # 定义输出的程序文件名
          - { os: linux,   arch: x64,   rid: linux-x64,   bin: 'MSLX-Desktop',     runner: ubuntu-latest }
          - { os: linux,   arch: arm64, rid: linux-arm64, bin: 'MSLX-Desktop',     runner: ubuntu-latest }
          - { os: windows, arch: x64,   rid: win-x64,     bin: 'MSLX-Desktop.exe', runner: ubuntu-latest }
          - { os: windows, arch: arm64, rid: win-arm64,   bin: 'MSLX-Desktop.exe', runner: ubuntu-latest }
          - { os: osx,     arch: x64,   rid: osx-x64,     bin: 'MSLX-Desktop',     runner: macos-latest }
          - { os: osx,     arch: arm64, rid: osx-arm64,   bin: 'MSLX-Desktop',     runner: macos-latest }

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 确定版本号 (Tag vs Manual)
        id: version
        shell: bash
        run: |
          # 判断触发类型
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # 如果是 Tag 触发，使用 Tag 名称 (去掉 refs/tags/)
            echo "VERSION_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "这是正式 Release 构建: ${{ github.ref_name }}"
          else
            # 如果是手动触发，强制使用 beta
            echo "VERSION_NAME=beta" >> $GITHUB_ENV
            echo "这是手动触发构建，使用版本号: beta"
          fi

      - name: 导入 Developer ID Application 证书
        if: matrix.os == 'osx'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/mslx-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mslx-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          if [[ -z "$MACOS_CERTIFICATE_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::缺少 macOS 签名证书 Secrets"
            exit 1
          fi

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::证书中未找到 Developer ID Application 身份"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: 编译发布文件
        run: |
          set -euo pipefail

          # 定义临时目录
          PUBLISH_DIR="./publish_temp"
          DIST_DIR="./dist"
          mkdir -p $PUBLISH_DIR
          mkdir -p $DIST_DIR
          
          # 执行 dotnet publish
          dotnet publish ./MSLX.Desktop/MSLX.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --no-self-contained \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:CopyContentFiles=false \
            -o "$PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

          # 打包处理
          BASE_NAME="MSLX-Desktop_${{ env.VERSION_NAME }}_${{ matrix.rid }}"

          if [[ "${{ matrix.os }}" == "osx" ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements ./MSLX.Desktop/macOS.entitlements \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$PUBLISH_DIR/${{ matrix.bin }}"
            codesign --verify --strict --verbose=2 "$PUBLISH_DIR/${{ matrix.bin }}"
          fi
          
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            # --- Windows: 打包成 ZIP ---
            ARCHIVE_NAME="$BASE_NAME.zip"
          
            # 进入目录打包
            # -j 参数：不包含目录路径 (Junk paths)，解压直接看到 exe
            cd "$PUBLISH_DIR"
            zip -j "../$DIST_DIR/$ARCHIVE_NAME" "${{ matrix.bin }}"
          
          else
            # --- Linux/macOS: 打包成 TAR.GZ ---
            ARCHIVE_NAME="$BASE_NAME.tar.gz"
          
            cd "$PUBLISH_DIR"
            chmod +x "${{ matrix.bin }}"
            # 打包
            # -C 切换目录，确保包内没有多余层级
            tar -czvf "../$DIST_DIR/$ARCHIVE_NAME" "${{ matrix.bin }}"
          fi
          
          # 将生成的包路径保存到环境变量
          echo "ASSET_PATH=./dist/$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: 公证 macOS Desktop
        if: matrix.os == 'osx'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER_ID" ]]; then
            echo "::error::缺少 App Store Connect API Key Secrets"
            exit 1
          fi

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARY_ARCHIVE_PATH="$RUNNER_TEMP/MSLX-Desktop_${{ matrix.rid }}-notarization.zip"
          NOTARY_RESULT_PATH="$RUNNER_TEMP/notary-result.json"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "NOTARY_ARCHIVE_PATH=$NOTARY_ARCHIVE_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "./publish_temp/${{ matrix.bin }}" \
            "$NOTARY_ARCHIVE_PATH"

          set +e
          xcrun notarytool submit "$NOTARY_ARCHIVE_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$NOTARY_RESULT_PATH"
          SUBMIT_EXIT=$?
          set -e

          cat "$NOTARY_RESULT_PATH"
          SUBMISSION_ID=$(jq -r '.id // empty' "$NOTARY_RESULT_PATH" 2>/dev/null || true)

          if [[ "$SUBMIT_EXIT" -ne 0 || -z "$SUBMISSION_ID" ]]; then
            echo "::error::Apple 公证提交失败，未获取到 Submission ID"
            exit 1
          fi

          echo "::notice title=Apple 公证已提交::Submission ID: $SUBMISSION_ID"

          while true; do
            set +e
            xcrun notarytool info "$SUBMISSION_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --output-format json > "$NOTARY_RESULT_PATH"
            INFO_EXIT=$?
            set -e

            cat "$NOTARY_RESULT_PATH"
            SUBMISSION_STATUS=$(jq -r '.status // empty' "$NOTARY_RESULT_PATH" 2>/dev/null || true)

            case "$SUBMISSION_STATUS" in
              Accepted)
                echo "Apple 公证已通过，Submission ID: $SUBMISSION_ID"
                break
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER_ID" || true
                echo "::error::Apple 公证失败，Submission ID: ${SUBMISSION_ID}，状态: $SUBMISSION_STATUS"
                exit 1
                ;;
              *)
                if [[ "$INFO_EXIT" -ne 0 ]]; then
                  echo "Apple 公证状态查询失败，将继续重试，Submission ID: $SUBMISSION_ID"
                else
                  echo "Apple 公证仍在处理中，Submission ID: ${SUBMISSION_ID}，状态: ${SUBMISSION_STATUS:-unknown}"
                fi
                sleep 60
                ;;
            esac
          done

      - name: 清理 macOS 签名凭据
        if: always() && matrix.os == 'osx'
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          if [[ -n "${NOTARY_ARCHIVE_PATH:-}" ]]; then
            rm -f "$NOTARY_ARCHIVE_PATH"
          fi
          rm -f "$RUNNER_TEMP/mslx-developer-id.p12"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 指定上传的文件
          files: ${{ env.ASSET_PATH }}
          tag_name: ${{ env.VERSION_NAME }}
          # 如果是 beta 版本，标记为预发布
          prerelease: ${{ env.VERSION_NAME == 'beta' }}

      - name: 同步上传到 CNB Release
        env:
          CNB_REPO_SLUG: "mslmc/mslx"
          CNB_TOKEN: ${{ secrets.CNB_MAIN_REPO_TOKEN }}
          TAG_NAME: ${{ env.VERSION_NAME }}
        run: |
          echo "正在准备同步当前平台的产物到国内 CNB 主节点..."
          
          if [[ "$TAG_NAME" == "beta" ]]; then
            echo "当前为手动测试构建，跳过 CNB 同步。"
            exit 0
          fi

          if [ ! -f "${{ env.ASSET_PATH }}" ]; then
            echo "❌ 错误：未找到生成的压缩包文件！"
            exit 1
          fi

          FILE_NAME=$(basename "${{ env.ASSET_PATH }}")
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            FILE_SIZE=$(stat -f%z "${{ env.ASSET_PATH }}")
          else
            FILE_SIZE=$(stat -c%s "${{ env.ASSET_PATH }}")
          fi

          curl -s \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/git/branches?page_size=1" > branches_res.json
          
          CNB_TARGET_BRANCH=$(jq -r 'if type == "array" then .[0].name else .data[0].name? // .items[0].name? // "main" end' branches_res.json)
          
          if [ -z "$CNB_TARGET_BRANCH" ] || [ "$CNB_TARGET_BRANCH" = "null" ]; then
            CNB_TARGET_BRANCH="main" # 兜底安全分支
          fi
          echo "💡 锁定 CNB 侧分支为: $CNB_TARGET_BRANCH"

          curl -s -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"tag_name\": \"${TAG_NAME}\", \"target_commitish\": \"${CNB_TARGET_BRANCH}\", \"name\": \"Release ${TAG_NAME}\", \"body\": \"Synchronized from GitHub Main Repo\"}" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases" > create_res.json

          RELEASE_ID=$(jq -r '.id // empty' create_res.json)

          # 并发矩阵节点查缺补漏列表反查
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "正在反查已存在的 Release 标识符..."
            curl -s \
              -H "Authorization: token $CNB_TOKEN" \
              -H "Accept: application/json" \
              "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases" > list_res.json
            
            RELEASE_ID=$(jq -r --arg tag "$TAG_NAME" 'if type == "array" then .[] else .data[]? // .items[]? // .[]? end | select(.tag_name==$tag) | .id' list_res.json | head -n 1)
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ 错误：未能获取到 CNB 的 Release ID。返回内容："
            cat create_res.json
            echo "列表反查内容："
            cat list_res.json
            exit 1
          fi

          echo "✅ 成功对接主仓 Release，ID 为: $RELEASE_ID"

          # 获取附件上传地址
          curl -s -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"asset_name\": \"${FILE_NAME}\", \"size\": ${FILE_SIZE}, \"overwrite\": true}" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases/${RELEASE_ID}/asset-upload-url" > url_res.json

          UPLOAD_URL=$(jq -r '.upload_url // empty' url_res.json)
          VERIFY_URL=$(jq -r '.verify_url // empty' url_res.json)

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "❌ 错误：无法获取上传地址。返回内容："
            cat url_res.json
            exit 1
          fi

          echo "正在把文件 $FILE_NAME 推送到预签名高速通道..."
          curl -s -X PUT -T "${{ env.ASSET_PATH }}" "$UPLOAD_URL"

          echo "正在确认附件上传状态..."
          CONFIRM_CODE=$(curl -s -o confirm_res.json -w "%{http_code}" -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Accept: application/json" \
            "${VERIFY_URL}?ttl=0")

          if [ "$CONFIRM_CODE" -eq 200 ] || [ "$CONFIRM_CODE" -eq 201 ]; then
            echo "🎉 [${{ matrix.rid }}] 平台产物已关联到 CNB 主仓 Release 页面！"
          else
            echo "❌ 错误：确认附件失败。状态码: ${CONFIRM_CODE}，返回内容："
            cat confirm_res.json
            exit 1
          fi
