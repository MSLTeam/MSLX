name: 构建 MSLX-Desktop Dev 版本 (macOS DMG包)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    name: 构建发布 macOS DMG
    
    strategy:
      matrix:
        include:
          - { arch: x64,   rid: osx-x64,   bin: 'MSLX-Desktop' }
          - { arch: arm64, rid: osx-arm64, bin: 'MSLX-Desktop' }

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 确定版本号名称
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
            echo "VERSION_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=dev" >> $GITHUB_ENV
          fi

      - name: 发布 macOS 独立运行包 (生成 .app)
        run: |
          PUBLISH_DIR="./publish_temp"
          DIST_DIR="./dist"
          mkdir -p $DIST_DIR
          
          dotnet publish ./MSLX.Desktop/MSLX.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: 安装 create-dmg 工具
        run: brew install create-dmg

      - name: 生成 .dmg 安装包
        run: |
          BASE_NAME="MSLX-Desktop_${{ env.VERSION_NAME }}_${{ matrix.rid }}"
          DIST_DIR="./dist"
          
          # 使用 find 寻找 .app 文件夹，因为它可能叫 MSLX-Desktop.app 并且可能不在 publish_temp 下
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到生成的 .app 文件夹！Dotnet.Bundle 可能没有正常执行。"
            exit 1
          fi
          echo "找到 .app 文件夹：$APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          
          # 把 .app 复制到一个干净的目录进行打包
          mkdir -p dmg_build
          cp -r "$APP_PATH" dmg_build/
          cd dmg_build
          
          # create-dmg 对 .app 进行打包
          create-dmg \
            --volname "MSLX Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 150 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 450 190 \
            "../$DIST_DIR/$BASE_NAME.dmg" \
            "$APP_NAME"
            
          cd ..
          echo "UPLOAD_PATH=$DIST_DIR/$BASE_NAME.dmg" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$BASE_NAME" >> $GITHUB_ENV

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.UPLOAD_PATH }}
          if-no-files-found: error
