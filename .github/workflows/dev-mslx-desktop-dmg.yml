name: 构建 MSLX-Desktop Dev 版本 (macOS DMG包)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    name: 构建发布 macOS DMG
    
    strategy:
      matrix:
        include:
          - { arch: x64,   rid: osx-x64,   bin: 'MSLX-Desktop' }
          - { arch: arm64, rid: osx-arm64, bin: 'MSLX-Desktop' }

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 确定版本号名称
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
            echo "VERSION_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=dev" >> $GITHUB_ENV
          fi

      - name: 导入 Developer ID Application 证书
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/mslx-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mslx-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          if [[ -z "$MACOS_CERTIFICATE_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::缺少 macOS 签名证书 Secrets"
            exit 1
          fi

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::证书中未找到 Developer ID Application 身份"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: 发布 macOS 独立运行包 (生成 .app)
        run: |
          DESKTOP_PUBLISH_DIR="./publish_desktop_temp"
          DAEMON_PUBLISH_DIR="./publish_daemon_temp"
          DIST_DIR="./dist"
          mkdir -p $DIST_DIR

          DESKTOP_VERSION=$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' ./MSLX.Desktop/MSLX.Desktop.csproj)
          DAEMON_VERSION=$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' ./MSLX.Daemon/MSLX.Daemon.csproj)
          if [[ "$DESKTOP_VERSION" != "$DAEMON_VERSION" ]]; then
            echo "::error::Desktop 与 Daemon 版本不一致: $DESKTOP_VERSION != $DAEMON_VERSION"
            exit 1
          fi
          
          dotnet publish ./MSLX.Desktop/MSLX.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$DESKTOP_PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

          dotnet publish ./MSLX.Daemon/MSLX.Daemon.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$DAEMON_PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: 安装 create-dmg 工具
        run: brew install create-dmg

      - name: 生成 .dmg 安装包
        run: |
          BASE_NAME="MSLX-Desktop_${{ env.VERSION_NAME }}_${{ matrix.rid }}"
          DIST_DIR="./dist"
          
          echo "开始手动构建 macOS .app 结构..."
          APP_NAME="MSLX.app"
          APP_DIR="dmg_build/$APP_NAME"
          
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # 1. 将同架构 Desktop 与 Daemon 放入 Contents/MacOS
          cp "./publish_desktop_temp/${{ matrix.bin }}" "$APP_DIR/Contents/MacOS/"
          cp "./publish_daemon_temp/MSLX-Daemon" "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/${{ matrix.bin }}"
          chmod +x "$APP_DIR/Contents/MacOS/MSLX-Daemon"
          
          # 2. 拷贝图标文件
          cp ./MSLX.Desktop/Assets/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          
          # 3. 写入标准的 Info.plist 文件
          cat <<EOF > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ matrix.bin }}</string>
              <key>CFBundleIconFile</key>
              <string>icon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>cn.mslmc.mslx</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleName</key>
              <string>MSLX</string>
              <key>CFBundleDisplayName</key>
              <string>MSLX</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
          </dict>
          </plist>
          EOF

          test "$(plutil -extract CFBundlePackageType raw -o - "$APP_DIR/Contents/Info.plist")" = "APPL"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "开始签名 $APP_NAME..."
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            while IFS= read -r -d '' FILE_PATH; do
              if file "$FILE_PATH" | grep -q 'Mach-O'; then
                echo "签名: $FILE_PATH"
                codesign \
                  --force \
                  --timestamp \
                  --options runtime \
                  --entitlements ./MSLX.Desktop/macOS.entitlements \
                  --keychain "$KEYCHAIN_PATH" \
                  --sign "$SIGNING_IDENTITY" \
                  "$FILE_PATH"
              fi
            done < <(find "$APP_DIR/Contents/MacOS" -type f -print0)

            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements ./MSLX.Desktop/macOS.entitlements \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$APP_DIR"

            codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          fi
          
          cd dmg_build
          
          # create-dmg 对 .app 进行打包，加入极简美化参数
          create-dmg \
            --volname "MSLX Installer" \
            --volicon "../MSLX.Desktop/Assets/icon.icns" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon-size 120 \
            --text-size 14 \
            --icon "$APP_NAME" 120 120 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 380 120 \
            "../$DIST_DIR/$BASE_NAME.dmg" \
            "$APP_NAME"
            
          cd ..
          echo "UPLOAD_PATH=$DIST_DIR/$BASE_NAME.dmg" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$BASE_NAME" >> $GITHUB_ENV

      - name: 签名 DMG
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          codesign \
            --force \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "${{ env.UPLOAD_PATH }}"
          codesign --verify --verbose=2 "${{ env.UPLOAD_PATH }}"

      - name: 清理签名凭据
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -f "$RUNNER_TEMP/mslx-developer-id.p12"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.UPLOAD_PATH }}
          if-no-files-found: error
