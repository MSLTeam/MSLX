name: 构建 MSLX-Desktop Dev 版本 (macOS DMG包)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    name: 构建发布 macOS DMG
    
    strategy:
      matrix:
        include:
          - { arch: x64,   rid: osx-x64,   bin: 'MSLX-Desktop' }
          - { arch: arm64, rid: osx-arm64, bin: 'MSLX-Desktop' }

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 确定版本号名称
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
            echo "VERSION_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=dev" >> $GITHUB_ENV
          fi

      - name: 导入 Developer ID Application 证书
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/mslx-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mslx-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          if [[ -z "$MACOS_CERTIFICATE_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::缺少 macOS 签名证书 Secrets"
            exit 1
          fi

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::证书中未找到 Developer ID Application 身份"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: 发布 macOS App 组件
        run: |
          set -euo pipefail

          DESKTOP_PUBLISH_DIR="./publish_desktop_temp"
          DAEMON_PUBLISH_DIR="./publish_daemon_temp"
          RUNTIME_PUBLISH_DIR="./publish_dotnet_runtime_temp"
          DIST_DIR="./dist"
          mkdir -p "$DIST_DIR"

          DOTNET_RUNTIME_VERSION=$(dotnet --list-runtimes | awk '$1 == "Microsoft.AspNetCore.App" { print $2 }' | tail -n 1)
          if [[ -z "$DOTNET_RUNTIME_VERSION" ]]; then
            echo "::error::无法确定 ASP.NET Core Runtime 版本"
            exit 1
          fi

          echo "共享 .NET Runtime 版本: $DOTNET_RUNTIME_VERSION"
          echo "DOTNET_RUNTIME_VERSION=$DOTNET_RUNTIME_VERSION" >> "$GITHUB_ENV"
          
          dotnet publish ./MSLX.Desktop/MSLX.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=../Resources/dotnet \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$DESKTOP_PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

          dotnet publish ./MSLX.Daemon/MSLX.Daemon.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=../Resources/dotnet \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$DAEMON_PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --runtime aspnetcore \
            --version "$DOTNET_RUNTIME_VERSION" \
            --architecture "${{ matrix.arch }}" \
            --os osx \
            --install-dir "$RUNTIME_PUBLISH_DIR" \
            --no-path

      - name: 安装 create-dmg 工具
        run: brew install create-dmg

      - name: 生成 .dmg 安装包
        run: |
          set -euo pipefail

          BASE_NAME="MSLX-Desktop_${{ env.VERSION_NAME }}_${{ matrix.rid }}"
          DIST_DIR="./dist"
          
          echo "开始手动构建 macOS .app 结构..."
          APP_NAME="MSLX.app"
          APP_DIR="dmg_build/$APP_NAME"
          
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          mkdir -p "$APP_DIR/Contents/Resources/dotnet"
          
          # 1. MacOS 目录只放置可执行文件
          cp "./publish_desktop_temp/${{ matrix.bin }}" "$APP_DIR/Contents/MacOS/"
          cp "./publish_daemon_temp/MSLX-Daemon" "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/${{ matrix.bin }}"
          chmod +x "$APP_DIR/Contents/MacOS/MSLX-Daemon"

          # 2. Desktop 与 Daemon 共用一套私有 .NET / ASP.NET Core Runtime
          DOTNET_ROOT="$APP_DIR/Contents/Resources/dotnet"
          NETCORE_SHARED_ROOT="$DOTNET_ROOT/shared"
          NETCORE_RUNTIME_DIR="$NETCORE_SHARED_ROOT/Microsoft.NETCore.App/$DOTNET_RUNTIME_VERSION"
          ASPNETCORE_RUNTIME_DIR="$NETCORE_SHARED_ROOT/Microsoft.AspNetCore.App/$DOTNET_RUNTIME_VERSION"
          HOSTFXR_DIR="$DOTNET_ROOT/host/fxr/$DOTNET_RUNTIME_VERSION"

          cp -R "./publish_dotnet_runtime_temp/host" "$DOTNET_ROOT/"
          cp -R "./publish_dotnet_runtime_temp/shared" "$DOTNET_ROOT/"
          mkdir -p "$APP_DIR/Contents/Resources/Licenses/dotnet"
          cp "./publish_dotnet_runtime_temp/LICENSE.txt" "$APP_DIR/Contents/Resources/Licenses/dotnet/"
          cp "./publish_dotnet_runtime_temp/ThirdPartyNotices.txt" "$APP_DIR/Contents/Resources/Licenses/dotnet/"

          test -f "$HOSTFXR_DIR/libhostfxr.dylib"
          test -d "$NETCORE_RUNTIME_DIR"
          test -d "$ASPNETCORE_RUNTIME_DIR"
          test -x "$NETCORE_RUNTIME_DIR/createdump"

          # 原生库放入 Frameworks，Resources 中保留 .NET 所需的目录和相对符号链接。
          mv "$HOSTFXR_DIR/libhostfxr.dylib" "$APP_DIR/Contents/Frameworks/libhostfxr.dylib"
          ln -s ../../../../../Frameworks/libhostfxr.dylib "$HOSTFXR_DIR/libhostfxr.dylib"
          for RUNTIME_LIBRARY in "$NETCORE_RUNTIME_DIR"/*.dylib; do
            LIBRARY_NAME=$(basename "$RUNTIME_LIBRARY")
            test ! -e "$APP_DIR/Contents/Frameworks/$LIBRARY_NAME"
            mv "$RUNTIME_LIBRARY" "$APP_DIR/Contents/Frameworks/$LIBRARY_NAME"
            ln -s "../../../../../Frameworks/$LIBRARY_NAME" "$RUNTIME_LIBRARY"
          done

          # createdump 是运行时辅助可执行程序，放入 MacOS 并保留 .NET 的标准探测路径。
          mv "$NETCORE_RUNTIME_DIR/createdump" "$APP_DIR/Contents/MacOS/createdump"
          ln -s ../../../../../MacOS/createdump "$NETCORE_RUNTIME_DIR/createdump"
          chmod +x "$APP_DIR/Contents/MacOS/createdump"

          test -L "$HOSTFXR_DIR/libhostfxr.dylib"
          test -d "$NETCORE_SHARED_ROOT/Microsoft.NETCore.App/$DOTNET_RUNTIME_VERSION"
          test -d "$NETCORE_SHARED_ROOT/Microsoft.AspNetCore.App/$DOTNET_RUNTIME_VERSION"
          test -x "$APP_DIR/Contents/MacOS/createdump"
          test "$(find "$APP_DIR/Contents/MacOS" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -z "$(find "$APP_DIR/Contents/MacOS" -mindepth 1 -maxdepth 1 -type f ! -perm -111 -print -quit)"
          
          # 3. 拷贝图标文件及设置本地化资源目录
          cp ./MSLX.Desktop/Assets/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          mkdir -p "$APP_DIR/Contents/Resources/zh_CN.lproj"
          mkdir -p "$APP_DIR/Contents/Resources/zh-Hans.lproj"
          
          # 4. 写入标准的 Info.plist 文件
          cat <<EOF > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ matrix.bin }}</string>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>zh_CN</string>
                  <string>zh-Hans</string>
              </array>
              <key>CFBundleIconFile</key>
              <string>icon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>cn.mslmc.mslx</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleName</key>
              <string>MSLX</string>
              <key>CFBundleDisplayName</key>
              <string>MSLX</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
          </dict>
          </plist>
          EOF

          test "$(plutil -extract CFBundlePackageType raw -o - "$APP_DIR/Contents/Info.plist")" = "APPL"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "开始签名 $APP_NAME..."
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # 先签共享运行时中的原生动态库，再签辅助程序、应用可执行文件和外层 App。
            while IFS= read -r -d '' FILE_PATH; do
              if file "$FILE_PATH" | grep -q 'Mach-O'; then
                echo "签名运行时: $FILE_PATH"
                codesign \
                  --force \
                  --timestamp \
                  --options runtime \
                  --keychain "$KEYCHAIN_PATH" \
                  --sign "$SIGNING_IDENTITY" \
                  "$FILE_PATH"
              fi
            done < <(find "$APP_DIR/Contents/Frameworks" -type f -print0)

            codesign \
              --force \
              --timestamp \
              --options runtime \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$APP_DIR/Contents/MacOS/createdump"

            for FILE_PATH in \
              "$APP_DIR/Contents/MacOS/${{ matrix.bin }}" \
              "$APP_DIR/Contents/MacOS/MSLX-Daemon"; do
              if file "$FILE_PATH" | grep -q 'Mach-O'; then
                echo "签名可执行文件: $FILE_PATH"
                codesign \
                  --force \
                  --timestamp \
                  --options runtime \
                  --entitlements ./MSLX.Desktop/macOS.entitlements \
                  --keychain "$KEYCHAIN_PATH" \
                  --sign "$SIGNING_IDENTITY" \
                  "$FILE_PATH"
              fi
            done

            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements ./MSLX.Desktop/macOS.entitlements \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$APP_DIR"

            codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          fi
          
          cd dmg_build
          
          # create-dmg 对 .app 进行打包，加入极简美化参数
          create-dmg \
            --volname "MSLX Installer" \
            --volicon "../MSLX.Desktop/Assets/icon.icns" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon-size 120 \
            --text-size 14 \
            --icon "$APP_NAME" 120 120 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 380 120 \
            "../$DIST_DIR/$BASE_NAME.dmg" \
            "$APP_NAME"
            
          cd ..
          echo "UPLOAD_PATH=$DIST_DIR/$BASE_NAME.dmg" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$BASE_NAME" >> $GITHUB_ENV

      - name: 签名 DMG
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          codesign \
            --force \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "${{ env.UPLOAD_PATH }}"
          codesign --verify --verbose=2 "${{ env.UPLOAD_PATH }}"

      - name: 清理签名凭据
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -f "$RUNNER_TEMP/mslx-developer-id.p12"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.UPLOAD_PATH }}
          if-no-files-found: error
