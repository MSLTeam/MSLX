name: 构建 MSLX-Desktop Dev 版本 (依赖框架)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: 构建发布
    
    strategy:
      matrix:
        include:
          # 定义输出的程序文件名
          - { os: linux,   arch: x64,   rid: linux-x64,   bin: 'MSLX-Desktop',     runner: ubuntu-latest }
          - { os: linux,   arch: arm64, rid: linux-arm64, bin: 'MSLX-Desktop',     runner: ubuntu-latest }
          - { os: windows, arch: x64,   rid: win-x64,     bin: 'MSLX-Desktop.exe', runner: ubuntu-latest }
          - { os: windows, arch: arm64, rid: win-arm64,   bin: 'MSLX-Desktop.exe', runner: ubuntu-latest }
          - { os: osx,     arch: x64,   rid: osx-x64,     bin: 'MSLX-Desktop',     runner: macos-latest }
          - { os: osx,     arch: arm64, rid: osx-arm64,   bin: 'MSLX-Desktop',     runner: macos-latest }

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 确定版本号名称
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
            echo "VERSION_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=dev" >> $GITHUB_ENV
          fi

      - name: 导入 Developer ID Application 证书
        if: matrix.os == 'osx' && github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/mslx-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mslx-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          if [[ -z "$MACOS_CERTIFICATE_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::缺少 macOS 签名证书 Secrets"
            exit 1
          fi

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::证书中未找到 Developer ID Application 身份"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: 发布并提取单文件
        run: |
          set -euo pipefail

          # 定义路径
          BASE_NAME="MSLX-Desktop_${{ env.VERSION_NAME }}_${{ matrix.rid }}"
          PUBLISH_DIR="./publish_temp"
          DIST_DIR="./dist"
          mkdir -p $DIST_DIR
          
          # 执行发布
          dotnet publish ./MSLX.Desktop/MSLX.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --no-self-contained \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$PUBLISH_DIR" \
            -p:IncludeNativeLibrariesForSelfExtract=true

          if [[ "${{ matrix.os }}" == "osx" && "${{ github.event_name }}" != "pull_request" ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements ./MSLX.Desktop/macOS.entitlements \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$PUBLISH_DIR/${{ matrix.bin }}"
            codesign --verify --strict --verbose=2 "$PUBLISH_DIR/${{ matrix.bin }}"
          fi

          # 只提取可执行文件
          echo "正在处理纯净文件..."
          
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            # --- Windows ---
            # 直接把 .exe 复制到 dist 目录
            # 上传后 GitHub 会自动包一层 zip，解压即用
            cp "$PUBLISH_DIR/${{ matrix.bin }}" "$DIST_DIR/${{ matrix.bin }}"
            
            # 设置上传路径为具体的文件
            echo "UPLOAD_PATH=$DIST_DIR/${{ matrix.bin }}" >> $GITHUB_ENV
            
          else
            # --- Linux / macOS ---
            # 打包成 tar.gz 以保留 chmod +x 权限
            # 但我们只打包那一个文件
            
            cd "$PUBLISH_DIR"
            chmod +x "${{ matrix.bin }}"
            tar -czvf "../$DIST_DIR/$BASE_NAME.tar.gz" "${{ matrix.bin }}"
            cd ..
            
            echo "UPLOAD_PATH=$DIST_DIR/$BASE_NAME.tar.gz" >> $GITHUB_ENV
          fi

          echo "ARTIFACT_NAME=$BASE_NAME" >> $GITHUB_ENV

      - name: 清理 macOS 签名凭据
        if: always() && matrix.os == 'osx' && github.event_name != 'pull_request'
        run: |
          rm -f "$RUNNER_TEMP/mslx-developer-id.p12"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.UPLOAD_PATH }}
          if-no-files-found: error
